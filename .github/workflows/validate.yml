name: gitops-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - "argocd/**"
      - "k8s/**"
      - "k8s-api/**"
      - "app/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "argocd/**"
      - "k8s/**"
      - "k8s-api/**"
      - "app/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"

  workflow_dispatch:

concurrency:
  group: gitops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d relaxed .github/workflows argocd k8s k8s-api

  kubeconform:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate manifests
        run: |
          find argocd k8s k8s-api \( -name '*.yaml' -o -name '*.yml' \) -print0 \
            | xargs -0 kubeconform \
                -strict \
                -summary \
                -ignore-missing-schemas

  api-build-check:
    name: API Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Flask API image
        run: |
          docker build -t w9-api-ci:check ./app
