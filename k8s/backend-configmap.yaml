apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-demo-code
  namespace: demo
data:
  package.json: |
    {
      "scripts": {
        "start": "node server.js"
      },
      "dependencies": {
        "express": "^4.18.2"
      }
    }
  server.js: |
    const express = require("express");
    const app = express();

    app.get("/", (req, res) => {
      res.json({ ok: true, service: "backend-demo" });
    });

    app.get("/healthz", (req, res) => {
      res.send("ok");
    });

    app.listen(3000, "0.0.0.0", () => {
      console.log("backend-demo listening on 3000");
    });
